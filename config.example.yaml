# city-filtered config
#
# Generated by running the skill's `init` flow - you shouldn't need to hand-write this file,
# but it's plain YAML if you want to tweak something directly. Every field here is explained
# inline; delete a section entirely if it doesn't apply to you (e.g. no calendar, no
# community source, no social ladder goal).

# Bump this when the schema changes; the skill compares it on every run.
config_version: 1

# --- A. Where -----------------------------------------------------------------
location:
  city: "Lisbon"
  country: "Portugal"
  # Used to build source URLs (lu.ma/<city-slug> etc). Set once during init and corrected
  # there if a platform resolves the slug differently than expected.
  city_slug: "lisbon"

# --- B. Platforms discovered at setup ------------------------------------------
sources:
  platforms:
    - kind: luma
      # near-global coverage, safe default almost everywhere
    - kind: meetup
    - kind: eventbrite
      tld: "pt"          # eventbrite.pt, eventbrite.es, eventbrite.co.uk, eventbrite.com...
    - kind: custom
      name: "NOS Alive events calendar"     # example - replace with what setup actually finds
      url: "https://example.com/events"
      extraction_hint: "server-rendered, no embedded JSON - scrape rendered cards"

  # --- C. Personal/community source, if any ------------------------------------
  community:
    name: "Second Home Lisboa member events"
    url: "https://example-coworking.app/events"
    extraction_hint: "Next.js app - look for __NEXT_DATA__ before scraping cards"
    monthly_cap:
      enabled: true
      limit: 1
      note: "I only want to be nudged toward one of these a month - I'm already there daily."

# --- D. Calendar + recurring commitments ---------------------------------------
calendar:
  enabled: true
  calendar_id: "you@example.com"
  # If false or omitted, the issue will say plainly every run that dedup/conflict-checking
  # is incomplete.

recurring_commitments:
  # Soft conflicts only - flagged, never used to veto a pick.
  - days: "Mon-Fri"
    time: "07:00-08:00"
    label: "training"
  - days: "Wed"
    time: "19:00-20:00"
    label: "language class"

# --- E. Interests - the filtering lens ------------------------------------------
interests:
  - label: "AI / automation tooling"
    why: "This is what my consulting work is actually about."
    tier: primary
  - label: "Portuguese language practice"
    why: "Actively learning - low-stakes practice beats a classroom."
    tier: primary
  - label: "Running and open water swimming"
    why: "Training for a half-marathon this spring."
    tier: primary
  - label: "Live jazz"
    why: "Just enjoy it, no agenda."
    tier: secondary

social_ladder:
  enabled: true
  # Free text - the specific texture of "low-stakes" for this person.
  note: >
    New to the city, A2 Portuguese, prefer small recurring groups over one-off mixers.
    Ruled out: 60+ person "language exchange" bar nights - too loud, too transactional.

# --- F. Standing exclusions + budget --------------------------------------------
exclusions:
  - match: "recurring gym/fitness classes at the coworking space"
    reason: "Already pay for a gym membership elsewhere; a workout class isn't a social rep."
  - match: "the coworking space's weekly free-beer afterwork"
    reason: "Standing optionality, not a slot to schedule or count - explicitly not a pick."

budget:
  monthly_cap: "60 EUR"
  note: "Soft cap - flag pricier picks, don't hard-filter on this."

# --- G. Output preferences -------------------------------------------------------
output:
  masthead: "Lisbon, Filtered"
  local_copy_path: "~/Desktop"
  cadence:
    recurring: true
    day: "Sunday"
    note: "Wire this into the schedule skill separately - this field just records intent."
